<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Leoneila 💖</title>
    <style>
        /* Estilos base (se mantienen iguales) */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff4e8b, #ff9a9e);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .name {
            font-size: clamp(24px, 7vw, 36px);
            font-weight: bold;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, #ffe0f0, #fff);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }
        
        .buttons-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 120px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn {
            background: #ff0066;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 0, 102, 0.3);
            z-index: 1000;
        }

        #noBtn {
            background: white;
            color: #ff0066;
            position: relative;
        }

        #message {
            margin-top: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 1.5s ease-in;
            max-height: 70vh;
            overflow-y: auto;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .heart {
            position: fixed;
            bottom: -10px;
            pointer-events: none;
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="name">Leoneila Arjona 💖</div>
    <h2 id="question">¿Quieres salir conmigo este 14 de febrero?</h2>
    
    <div class="buttons-container" id="btnWrapper">
        <button id="yesBtn">Sí 💖</button>
        <button id="noBtn">No 😢</button>
    </div>

    <div id="message"></div>
</div>

<script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");
    const question = document.getElementById("question");
    const btnWrapper = document.getElementById("btnWrapper");
    
    let currentScale = 1;

    const handleNo = (e) => {
        // Obtenemos la posición y tamaño del botón SÍ para evitarlo
        const yesRect = yesBtn.getBoundingClientRect();
        
        let newX, newY;
        let isOverlapping = true;

        // Intentamos generar una posición hasta que no choque con el botón SÍ
        // Añadimos un margen de 100px para que no se topen
        while (isOverlapping) {
            newX = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            newY = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);

            const padding = 100; 
            const horizontalCheck = newX + noBtn.offsetWidth + padding < yesRect.left || newX > yesRect.right + padding;
            const verticalCheck = newY + noBtn.offsetHeight + padding < yesRect.top || newY > yesRect.bottom + padding;

            if (horizontalCheck || verticalCheck) {
                isOverlapping = false;
            }
        }

        noBtn.style.position = "fixed";
        noBtn.style.left = `${newX}px`;
        noBtn.style.top = `${newY}px`;
        noBtn.style.zIndex = "999";

        // Agrandar SÍ
        currentScale += 0.4;
        yesBtn.style.transform = `scale(${currentScale})`;
    };

    noBtn.addEventListener("mouseover", handleNo);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); handleNo(); });
    noBtn.addEventListener("click", (e) => { e.preventDefault(); handleNo(); });

    yesBtn.addEventListener("click", () => {
        btnWrapper.style.display = "none";
        question.style.display = "none";
        message.style.display = "block";
        
        message.innerHTML = `
            💕 ¡Excelente, mi amor! 💕<br><br>
            <b>Leoneila Arjona</b>, eres mi niña bonita, 
            la persona que ilumina mis días 
            y llena mi corazón de alegría infinita.<br><br>
            <i>"Como la Luna y el Sol, que aunque habitan cielos distintos,<br>
            no saben existir el uno sin el otro.<br>
            Tú eres mi luz en el día y mi guía en la sombra,<br>
            el eclipse perfecto donde mi alma se encuentra con la tuya."</i><br><br>
            💖 <b>Te amo muchísimo</b> 💖
        `;
    });

    function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 15) + "px";
        heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }
    setInterval(createHeart, 300);
</script>

</body>
</html>
